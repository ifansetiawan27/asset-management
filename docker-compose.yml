# AMS - Infrastruktur pengembangan lokal
# Jalankan: docker compose up -d
# Catatan: butuh Docker Desktop terpasang.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ams_admin
      POSTGRES_PASSWORD: ams_admin_pw
      POSTGRES_DB: ams
    ports:
      - '5432:5432'
    volumes:
      - ams_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ams_admin -d ams']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ams-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ams-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ams
      RABBITMQ_DEFAULT_PASS: ams
    ports:
      - '5672:5672'
      - '15672:15672'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: ams-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'

  minio:
    image: minio/minio:latest
    container_name: ams-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ams_minio
      MINIO_ROOT_PASSWORD: ams_minio_pw
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ams_minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ams-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
    ports:
      - '8080:8080'
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

volumes:
  ams_pg_data:
  ams_minio_data:
